<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🛒 My Shop</h1>

  <!-- Search Bar -->
  <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">

  <a href="cart.html" class="cart-btn">Cart 🛍</a>
</header>

<section class="products" id="product-list">

  <div class="product-card">
    <h2>Phone</h2>
    <p>Rs. 50,000</p>
    <button onclick="addToCart('Phone',50000)">Add to Cart</button>
  </div>

  <div class="product-card">
    <h2>Laptop</h2>
    <p>Rs. 150,000</p>
    <button onclick="addToCart('Laptop',150000)">Add to Cart</button>
  </div>

  <div class="product-card">
    <h2>Headphones</h2>
    <p>Rs. 8,000</p>
    <button onclick="addToCart('Headphones',8000)">Add to Cart</button>
  </div>

</section>

<script src="script.js"></script>
</body>
</html>
